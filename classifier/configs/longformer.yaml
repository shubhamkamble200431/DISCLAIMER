candidate: longformer
kind: encoder
model:
  name: allenai/longformer-base-4096
  max_length: 1024
  attention_window: 512
train:
  truncation: head
  class_weight: none
  focal_gamma: 2.0
  lr_sweep: [2.0e-5]
  epochs: 8
  early_stopping_patience: 2
  batch_size: 2
  grad_accum: 16
  eval_batch_size: 8
  throughput_batch_size: 32
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
