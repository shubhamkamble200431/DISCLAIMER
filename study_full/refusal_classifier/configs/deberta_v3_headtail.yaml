# A3 ablation: head_tail truncation, otherwise identical to deberta_v3.
candidate: deberta_v3_headtail
kind: encoder
model:
  name: microsoft/deberta-v3-base
  max_length: 512
train:
  truncation: head_tail    # first 255 + sep + last 255
  class_weight: none
  focal_gamma: 2.0
  lr_sweep: [1.0e-5, 2.0e-5, 3.0e-5]
  epochs: 8
  early_stopping_patience: 2
  batch_size: 8             # micro-batch; raise on DGX and drop grad_accum to match
  grad_accum: 4             # effective batch = 8*4 = 32, uniform across candidates
  eval_batch_size: 32
  throughput_batch_size: 32
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
