# Wide comparison (2026-09-17). 1.1B decoder; a full fine-tune needs ~18 GB, so LoRA
# adapters + a fully trained head, merged into best_state.pt after training. LoRA
# wants a higher LR than full fine-tuning, hence its own sweep.
candidate: tinyllama_lora
kind: decoder
model:
  name: TinyLlama/TinyLlama-1.1B-Chat-v1.0
  max_length: 1024
train:
  truncation: head
  head_init: zeros          # see src/train.py:load_classifier_model()
  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  class_weight: none
  focal_gamma: 2.0
  lr_sweep: [5.0e-5, 1.0e-4, 2.0e-4]
  epochs: 8
  early_stopping_patience: 2
  batch_size: 4             # micro-batch sized for a 16 GB card (5060 Ti)
  grad_accum: 8             # effective batch = 32, uniform across candidates
  eval_batch_size: 16
  throughput_batch_size: 16
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
