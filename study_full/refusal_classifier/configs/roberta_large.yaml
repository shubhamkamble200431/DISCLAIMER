# Wide comparison (2026-09-17). 512-position model: head truncation cuts ~5.5% of
# responses (ModernBERT-large/Longformer read 1024).
candidate: roberta_large
kind: encoder
model:
  name: roberta-large
  max_length: 512
train:
  truncation: head
  class_weight: none
  focal_gamma: 2.0
  lr_sweep: [1.0e-5, 2.0e-5, 3.0e-5]
  epochs: 8
  early_stopping_patience: 2
  batch_size: 8             # micro-batch sized for a 16 GB card (5060 Ti)
  grad_accum: 4             # effective batch = 32, uniform across candidates
  eval_batch_size: 32
  throughput_batch_size: 32
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
