# Candidate roster for the model screening test (plan_model_screening.md).
# Consumed by scripts/screen_tier1.py and, for survivors, by generate_activations.py.
#
# Every entry was verified against the HF API on 2026-09-19: the repo exists, gated=False,
# and the architecture/shape below comes from its config.json. Ordering is TIER ORDER --
# screen from the top. Tier A models are ranked by expected DISCLAIMER supply (Gate 1),
# which is the binding constraint, NOT by benchmark quality.
#
# Gate 1 context: over-refusal is a FAMILY-level property spanning ~2 orders of magnitude
# (ToxiGen causal refusal: Llama-3.1 15-36%, Falcon3 5-30%, Gemma-2 0.7-2%, Qwen2.5 0.01-0.2%,
# Mistral 0.00-0.06%). The incumbent set is 2x Qwen + 1x Gemma, i.e. the bottom of that range.
# Candidates are chosen to move UP it.

prompts:
  # 30 prompts, 10 NORMAL / 10 DISCLAIMER / 10 REFUSAL, picked where longformer and
  # modernbert_large agree AND all 3 current generation models gave the same label.
  # The reference label rides along as `group` and lands in answers.jsonl as
  # splits=screen_<LABEL>, so a candidate's answers crosstab against it directly.
  screen_set: data/screen/probe30.parquet
  splits:
    train: data/processed/train.parquet
    val:   data/processed/val.parquet
    test:  data/processed/test.parquet
  id_column: prompt_id
  text_column: prompt

output:
  root: data/screen/generated
  hidden_layout: per_layer
  compress: false
  store_dtype: float16

capture:
  layers: all
  points:
    - prompt_last
  last_k_prompt_tokens: 0

generation:
  # Raised from 256 -> 512 on 2026-09-20. 256 was chosen to save GPU time on a
  # 500-prompt DGX run; at 30 prompts on one box that saving is worth nothing, and
  # several candidates are verbose enough to hit 256 on most prompts (olmo2-1b 18/30,
  # falcon-h1 21/30, nemotron-nano-4b-v11 21/30). 512 also matches the incumbents'
  # original generation setting exactly.
  max_new_tokens: 512
  do_sample: false
  seed: 42

tier1:
  # smoke test only: does it load, can we hook it, is our layer numbering right.
  # Forward pass only -- no text is generated, so the prompts barely matter.
  n_prompts: 6
  verify_layers: [1, 4, 8, 16]   # empirically confirm saved-row-l == output of layers[l-1]

models:
  # ---------------------------------------------------------------- TIER A ---
  - name: nemotron-nano-4b-v11
    # Llama-3.1 lineage WITHOUT the Meta gate. Highest-over-refusing family measured.
    # LlamaForCausalLM, no auto_map, AEGIS/Garak safety documentation.
    hf_id: nvidia/Llama-3.1-Nemotron-Nano-4B-v1.1
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierA rank1 | H=3072 L=32 | licence nvidia-open"

  - name: falcon3-3b
    # Falcon lineage = 2nd-highest over-refusal family (5.04-29.63% ToxiGen).
    # Shallowest candidate at 22 blocks -- useful contrast for the depth analysis.
    hf_id: tiiuae/Falcon3-3B-Instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierA rank2 | H=3072 L=22 | licence falcon-llm"

  - name: olmo2-1b
    # The ONLY candidate with a citable safety number on its own card:
    # Tulu 3 safety 87.6 (vs Llama-3.1-1B 87.2, vs prior OLMo 1B 52.0).
    # 16 blocks -- half the depth of anything currently in the study.
    hf_id: allenai/OLMo-2-0425-1B-Instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierA rank3 | H=2048 L=16 | apache-2.0"

  - name: falcon-h1-1p5b-deep
    # Falcon post-training + 66 blocks at H=1280: by far the deepest/narrowest option.
    # Hybrid Mamba-2 || attention IN PARALLEL within a block (not interleaved).
    hf_id: tiiuae/Falcon-H1-1.5B-Deep-Instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierA rank4 | H=1280 L=66 | hybrid mamba2+attn | wants mamba-ssm for speed"

  - name: phi4-mini
    # Phi break-fix RLHF (arXiv 2407.13833); the family's own report concedes it errs
    # toward safety on innocuous prompts. Native phi3 arch, no remote code.
    hf_id: microsoft/Phi-4-mini-instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierA rank5 | H=3072 L=32 | mit"

  # ---------------------------------------------------------------- TIER B ---
  - name: granite-4p2-3b
    hf_id: ibm-granite/granite-4.2-3b
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false   # emitted raw CoT that ate the whole token budget on the 2026-09-20 run
    note: "tierB | H=2560 L=40 | apache-2.0 | IBM publishes AttaQ"

  - name: granite-4p0-h-1b
    hf_id: ibm-granite/granite-4.0-h-1b
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierB | H=1536 L=40 | apache-2.0 | hybrid mamba2 | IBM's current sub-2B"

  - name: smollm3-3b
    hf_id: HuggingFaceTB/SmolLM3-3B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false   # emitted raw CoT that ate the whole token budget on the 2026-09-20 run
    note: "tierB | H=2048 L=36 | apache-2.0 | no published refusal eval"

  - name: afm-4p5b
    hf_id: arcee-ai/AFM-4.5B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierB | H=2560 L=36 | apache-2.0 | independent from-scratch corpus, no refusal data"

  - name: minicpm5-2b
    hf_id: openbmb/MiniCPM5-2B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false   # emitted raw CoT that ate the whole token budget on the 2026-09-20 run
    note: "tierB | H=2048 L=42 | apache-2.0 | refusal prior inferential only"

  # ---------------------------------------------------------------- TIER C ---
  # These ship an auto_map. NemotronH is native in transformers, so it is listed with
  # trust_remote_code FALSE deliberately -- if it loads, we avoid the custom code path.
  # Screen these LAST; a failure here is cheap and expected.
  - name: nemotron3-nano-4b
    hf_id: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false   # emitted raw CoT that ate the whole token budget on the 2026-09-20 run
    trust_remote_code: false
    note: "tierC | FAILED tier1 on the DGX 2026-09-19: KeyError 'mlp' in cache_utils.py
           DynamicCache -- transformers 5.14.1 does not know the 'mlp' layer_type this
           hybrid config declares. RE-ENABLED for the 5060 Ti: that box runs transformers
           5.17, where DYNAMIC_LAYER_TYPE_MAPPING DOES contain 'mlp' (checked directly),
           so it should load there. Still OUT on the DGX until transformers moves."

  - name: phi-tiny-moe
    hf_id: microsoft/Phi-tiny-MoE-instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    trust_remote_code: true
    note: "tierC | FAILED tier1 on the DGX 2026-09-19: its custom modeling file requires
           flash_attn, which is not installed. Recoverable with `pip install flash_attn`
           in the base env if wanted -- but the custom code targets transformers ~4.4x,
           so expect a second failure after that. OUT unless someone wants to chase it."

  # ---------------------------------------------------------------- TIER R ---
  # Reference / calibration models, 8-9B. These are ABOVE the <4B slots being filled --
  # they are here as anchors, not as candidates to adopt.
  - name: qwen3-5-4b-control
    # THE CONTROL TO USE ON A 16 GB CARD. Same logic as the 9B below, but ~9 GB instead
    # of 18.3 GB, so it actually fits. Also an incumbent, also part of the agreement that
    # selected all 30 probe prompts, so it should return a near-clean 10/10/10 diagonal.
    # Read this before reading any candidate's numbers.
    hf_id: Qwen/Qwen3.5-4B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false     # must match the original run exactly or it is not a control
    note: "tierR CONTROL (16GB-friendly) | H=2560 L=32 | apache-2.0"

  - name: qwen3-5-9b-control
    # POSITIVE CONTROL, and on probe30 it is a sharp one. This is an incumbent, and all 30
    # prompts were chosen BECAUSE all three incumbents agreed on them. So this model should
    # reproduce the reference label on essentially all 30 -- a clean 10/10/10 diagonal.
    # Anything much off that means the harness is wrong (wrong cap, wrong template, wrong
    # classifier checkpoint), not that the model changed. Check this before reading any
    # candidate's numbers.
    # Caveat: max_new_tokens is 256 here vs 512 in the original run, which the truncation
    # calibration showed flips ~4% of DISCLAIMER answers -- so expect at most 1 off-diagonal
    # cell in the DISCLAIMER row, not zero.
    hf_id: Qwen/Qwen3.5-9B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false     # must match the original run exactly or it is not a control
    note: "tierR CONTROL | H=4096 L=32 | apache-2.0 | expect 13.3% DISCLAIMER on random group"

  - name: deepseek-r1-distill-llama-8b
    # An UNGATED route to Llama-3.1-8B weights (MIT, LlamaForCausalLM). BUT R1 reasoning
    # distillation is reported to erode the safety tuning of the base -- IBM specifically
    # contrasts Granite's preserved AttaQ robustness against DeepSeek-distilled models.
    # So do NOT read this as a proxy for Llama-3.1-8B-Instruct's refusal behaviour; it is
    # its own data point, and an interesting one precisely because of that erosion.
    hf_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierR | H=4096 L=32 | mit | Llama-3.1-8B distill, safety tuning likely eroded"

  - name: ministral-3-8b
    # Mistral lineage measures 0.00-0.06% causal refusal on ToxiGen -- the LOWEST of any
    # family tested. Included as the low-hedging end of the scale, i.e. a negative control.
    # Mistral3ForConditionalGeneration is a multimodal wrapper: expect the runner's
    # AutoModelForImageTextToText fallback to fire, exactly as it may for Gemma.
    hf_id: mistralai/Ministral-3-8B-Instruct-2512
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    note: "tierR NEGATIVE CONTROL | H=4096 L=34 | apache-2.0 | lowest-refusal family"

  # meta-llama/Llama-3.1-8B-Instruct is GATED (gated=manual, llama3.1 licence).
  # It is the reference model in every over-refusal paper (15.30-36.16% ToxiGen,
  # 28.53% RedBench -- the highest of any model tested) and would be the ideal
  # calibration anchor, but it needs a Hugging Face token with the licence accepted,
  # which scripts/slurm/config.sh deliberately does not carry.
  # To enable it: accept the licence on the model page, then set HF_TOKEN in the
  # environment and uncomment the block below.
  #
  # - name: llama31-8b
  #   hf_id: meta-llama/Llama-3.1-8B-Instruct
  #   dtype: bfloat16
  #   device_map: auto
  #   attn_implementation: sdpa
  #   system_prompt: null
  #   note: "tierR GATED | H=4096 L=32 | needs HF_TOKEN | highest-refusal reference"

# --smoke swaps in a tiny ungated model so the harness itself can be tested offline.
smoke:
  n_prompts: 3
  models:
    - name: smoke-qwen2.5-1.5b
      hf_id: Qwen/Qwen2.5-Coder-1.5B-Instruct
      dtype: bfloat16
      device_map: auto
      attn_implementation: sdpa
