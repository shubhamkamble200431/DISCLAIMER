prompts:
  splits:
    train: data/processed/train.parquet
    val:   data/processed/val.parquet
    test:  data/processed/test.parquet
  id_column: prompt_id
  text_column: prompt
output:
  root: data/generated
  hidden_layout: per_layer
  compress: false
  store_dtype: float16
capture:
  layers: all
  points:
    - prompt_last
  last_k_prompt_tokens: 0
generation:
  max_new_tokens: 512
  do_sample: false
  seed: 42
models:
  - name: qwen3.5-4b
    hf_id: Qwen/Qwen3.5-4B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false
