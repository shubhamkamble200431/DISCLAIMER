study:
  seed: 42
  split_fractions:
    direction: 0.40
    probing: 0.20
    steering: 0.40
  partition: shared
  stratify_on: [label_triple, cstar_split]
  labels3: [NORMAL, DISCLAIMER, REFUSAL]
  min_n: 30
  classifier_run_dir: ../classifier/results/runs/longformer_42_20260916-160022
  classifier_repo: ../classifier
  report_cstar_test_clean: true
  bootstrap:
    B: 10000
    ci: 0.95
    method: percentile
    shared_index: true
prompts:
  splits:
    train: data/processed/train.parquet
    val:   data/processed/val.parquet
    test:  data/processed/test.parquet
  id_column: prompt_id
  text_column: prompt
output:
  root: data/generated
  generated_root: data/generated
  study_root: data/study
  steered_root: data/steered
  hidden_layout: stacked
  compress: false
  store_dtype: float16
capture:
  layers: all
  points:
    - prompt_last
  last_k_prompt_tokens: 0
generation:
  max_new_tokens: 1024
  do_sample: false
  seed: 42
directions:
  names: [dR, dD]
  method: dim
  balance_draws: 50
  balance_target: min_RD
  estimated_on: direction
probe:
  criterion: union_top_k_auroc_R_vs_rest_and_D_vs_rest
  folds: 5
  top_k: 10
  steerable_rows_only: true
steering:
  positions: prefill_last
  directions: [dR, dD]
  alphas: [-20, -10, -5, -2, -1, 0, 1, 2, 5, 10, 20]
  baseline_alpha: 0
  x_axis: alpha_over_sigma
  main_figure:
    top_n_layers: 5
    rank_subset: full
  batch_size: 1
  padding_side: left
  bucket_by_length: true
  static_batch_membership: true
  max_prompt_tokens: null
  output_format: answers_jsonl
  save_activations: false
  scoring:
    metric_basis: argmax_label
    shard_rows: 20000
    val_parity_gate: true
  control:
    enabled: false
    kind: random-unit
    draws: 5
models:
  - name: qwen3.5-4b
    hf_id: Qwen/Qwen3.5-4B
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null
    chat_template_kwargs:
      enable_thinking: false
  - name: olmo3-7b
    hf_id: allenai/Olmo-3-7B-Instruct
    dtype: bfloat16
    device_map: auto
    attn_implementation: sdpa
    system_prompt: null

smoke:
  n_prompts: 256
  generation:
    max_new_tokens: 1024
  steering:
    alphas: [-5, 0, 5]
    batch_size: 1
  probe:
    folds: 2
    top_k: 2
  models:
    - name: qwen3.5-4b
      hf_id: Qwen/Qwen3.5-4B
      dtype: bfloat16
      device_map: auto
      attn_implementation: sdpa
      system_prompt: null
      chat_template_kwargs:
        enable_thinking: false
    - name: olmo3-7b
      hf_id: allenai/Olmo-3-7B-Instruct
      dtype: bfloat16
      device_map: auto
      attn_implementation: sdpa
